
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Our Space - Login ❤️</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #fff5f8,
                    #ffe4ed
                );

            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
        }

        .login-card {
            background: white;

            padding: 35px 25px;

            border-radius: 25px;

            box-shadow:
                0 10px 35px
                rgba(0, 0, 0, 0.10);

            text-align: center;
        }

        .heart {
            font-size: 55px;
            margin-bottom: 5px;
        }

        h1 {
            margin: 5px 0 8px;
            color: #e75480;
        }

        .subtitle {
            color: #999;
            font-size: 14px;
            margin-bottom: 25px;
        }

        input {
            width: 100%;

            padding: 14px;

            margin-bottom: 15px;

            border: 1px solid #ddd;

            border-radius: 13px;

            font-size: 15px;

            outline: none;

            transition: 0.2s;
        }

        input:focus {
            border-color: #e75480;

            box-shadow:
                0 0 0 3px rgba(231, 84, 128, 0.10);
        }

        .login-btn {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 13px;

            background: #e75480;

            color: white;

            font-size: 16px;

            cursor: pointer;

            transition: 0.2s;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;

            font-size: 14px;

            min-height: 20px;

            line-height: 1.5;
        }

        .footer {
            margin-top: 25px;

            color: #aaa;

            font-size: 12px;
        }

        @media (max-width: 500px) {

            .login-card {
                padding: 30px 20px;
            }

            .heart {
                font-size: 48px;
            }

            h1 {
                font-size: 28px;
            }

        }

    </style>

</head>


<body>


<div class="login-container">

    <div class="login-card">

        <div class="heart">
            💕
        </div>

        <h1>
            Our Space
        </h1>

        <p class="subtitle">
            Only for us ❤️
        </p>


        <!-- =========================
             USERNAME
        ========================== -->

        <input
            type="text"
            id="username"
            placeholder="👤 Username"
            autocomplete="username"
            onkeydown="handleEnter(event)"
        >


        <!-- =========================
             PASSWORD
        ========================== -->

        <input
            type="password"
            id="password"
            placeholder="🔐 Password"
            autocomplete="current-password"
            onkeydown="handleEnter(event)"
        >


        <!-- =========================
             LOGIN BUTTON
        ========================== -->

        <button
            class="login-btn"
            id="loginButton"
            onclick="login()">

            ❤️ Login

        </button>


        <!-- =========================
             MESSAGE
        ========================== -->

        <p id="message"></p>


        <p class="footer">
            Nur Hazirah ❤️ Zulkarnain
        </p>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://ognpydprqxxwjdnophxq.supabase.co";

const SUPABASE_KEY =
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9nbnB5ZHBycXh4d2pkbm9waHhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyOTM3NzIsImV4cCI6MjEwMjg2OTc3Mn0.GEboyNWovkJ7U9zXAWtzcQ7iddISbQuoLSirBJfFkrM";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// ==========================================
// LOGIN
// ==========================================

async function login() {

    const username =
        document.getElementById("username")
        .value
        .trim()
        .toLowerCase();

    const password =
        document.getElementById("password")
        .value;

    const message =
        document.getElementById("message");

    const button =
        document.getElementById("loginButton");


    // ======================================
    // CHECK INPUT
    // ======================================

    if (!username || !password) {

        message.style.color = "#e75480";

        message.textContent =
            "Please enter username and password ❤️";

        return;
    }


    button.disabled = true;

    button.textContent =
        "Logging in...";

    message.style.color = "#999";

    message.textContent =
        "Checking account...";


    try {

        // ==================================
        // FIND USERNAME
        // ==================================

        const {
            data: profile,
            error: profileError
        } =
            await supabaseClient
                .from("profiles")
                .select("id, username, email")
                .eq("username", username)
                .maybeSingle();


        if (profileError) {

            console.error(
                "PROFILE ERROR:",
                profileError
            );

            throw new Error(
                profileError.message
            );
        }


        // ==================================
        // USERNAME NOT FOUND
        // ==================================

        if (!profile) {

            throw new Error(
                "Username not found ❤️"
            );
        }


        console.log(
            "Profile found:",
            profile
        );


        // ==================================
        // CHECK EMAIL
        // ==================================

        if (!profile.email) {

            throw new Error(
                "No email is connected to this username."
            );
        }


        // ==================================
        // LOGIN AUTH
        // ==================================

        message.textContent =
            "Checking password...";


        const {
            data: authData,
            error: authError
        } =
            await supabaseClient.auth
                .signInWithPassword({

                    email: profile.email,

                    password: password

                });


        if (authError) {

            console.error(
                "AUTH ERROR:",
                authError
            );

            throw new Error(
                authError.message
            );
        }


        // ==================================
        // SUCCESS
        // ==================================

        console.log(
            "LOGIN SUCCESS:",
            authData.user
        );


        localStorage.setItem(
            "ourSpaceUsername",
            profile.username
        );


        message.style.color =
            "#4caf50";

        message.textContent =
            "Login successful ❤️";


        button.textContent =
            "💕 Welcome";


        // ==================================
        // GO TO MAIN PAGE
        // ==================================

        setTimeout(() => {

            window.location.href =
                "index.html";

        }, 700);


    } catch (error) {

        console.error(
            "LOGIN ERROR:",
            error
        );


        message.style.color =
            "#e75480";

        message.textContent =
            error.message;


        button.disabled = false;

        button.textContent =
            "❤️ Login";

    }

}


// ==========================================
// ENTER KEY
// ==========================================

function handleEnter(event) {

    if (event.key === "Enter") {

        login();

    }

}

</script>
</body>
</html>
