<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Space ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>💕 Our Space</h1>
        <p class="subtitle">Our little place ❤️</p>

        <div class="note-form">

            <input
                type="text"
                id="title"
                placeholder="Note title..."
            >

            <textarea
                id="content"
                placeholder="Write something..."
            ></textarea>

            <button onclick="addNote()">
                + Save Note
            </button>

        </div>

        <h2>📝 Our Notes</h2>

        <div id="notes">
            <p>Loading notes...</p>
        </div>

    </div>
    <hr>

<section class="gallery-section">

    <h2>📸 Our Gallery</h2>

    <input
        type="file"
        id="imageInput"
        accept="image/*"
    >

    <input
        type="text"
        id="caption"
        placeholder="Caption for this photo..."
    >

    <button onclick="uploadImage()">
        📸 Upload Photo
    </button>

    <div id="gallery"></div>

</section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>

</body>
</html>
