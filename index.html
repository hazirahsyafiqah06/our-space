<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Space ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

      <div class="hero">

    <p class="small-title">WELCOME TO</p>

    <h1>💕 Our Space</h1>

    <p class="couple-name">
        Nur Hazirah ❤️ Zulkarnain
    </p>

    <p class="since">
        Together since 18 January 2021
    </p>

</div>
        <nav class="navigation">

    <button onclick="showSection('notes-section')">
        📝 Notes
    </button>

    <button onclick="showSection('gallery-section')">
        📸 Gallery
    </button>

    <button onclick="showSection('memories-section')">
        💌 Memories
    </button>

</nav>
        <div class="note-form">

            <input
                type="text"
                id="title"
                placeholder="Note title..."
            >

            <textarea
                id="content"
                placeholder="Write something..."
            ></textarea>

            <button onclick="addNote()">
                + Save Note
            </button>

        </div>

        <section id="notes-section">

    <h2>📝 Our Notes</h2>

    <div class="note-form">

        <input
            type="text"
            id="title"
            placeholder="Note title..."
        >

        <textarea
            id="content"
            placeholder="Write something for your baby... ❤️"
        ></textarea>

        <button onclick="addNote()">
            + Save Note
        </button>

    </div>

    <div id="notes"></div>

</section>

<section id="gallery-section">

    <h2>📸 Our Gallery</h2>

    <input
        type="file"
        id="imageInput"
        accept="image/*"
    >

    <input
        type="text"
        id="caption"
        placeholder="Caption for this photo..."
    >

    <button onclick="uploadImage()">
        📸 Upload Photo
    </button>

    <div id="gallery"></div>

</section>
        <section id="memories-section">

    <h2>💌 Our Memories</h2>

    <div class="memory">

        <span>❤️</span>

        <div>
            <h3>18 January 2021</h3>
            <p>The beginning of our story.</p>
        </div>

    </div>

    <div class="memory">

        <span>💕</span>

        <div>
            <h3>Our First Memory</h3>
            <p>More memories coming soon...</p>
        </div>

    </div>

</section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./script.js"></script>

</body>
</html>
