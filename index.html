<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Space ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>💕 Our Space</h1>
        <p class="subtitle">Our little place ❤️</p>

        <div class="note-form">

            <input
                type="text"
                id="title"
                placeholder="Note title..."
            >

            <textarea
                id="content"
                placeholder="Write something..."
            ></textarea>

            <button onclick="addNote()">
                + Save Note
            </button>

        </div>

        <h2>📝 Our Notes</h2>

        <div id="notes">
            <p>Loading notes...</p>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
